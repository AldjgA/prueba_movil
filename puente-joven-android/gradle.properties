org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
# AJUSTE IMPORTANTE: fija el JDK 17 para TODO el build.
# Sin esta línea, Gradle reutiliza daemons arrancados con el JVM por defecto de la
# máquina (JDK 24 aquí), y el daemon de Kotlin falla con
# `java.rmi.NoSuchObjectException: no such object in table`.
org.gradle.java.home=C:/Program Files/Java/jdk-17
# La caché de build falla en Windows con
# "Could not get file mode for ... R.jar" al empaquetar RClassOutputJar.
# Se desactiva para que la compilación sea reproducible en esta máquina.
org.gradle.caching=false
org.gradle.configuration-cache=false

# El daemon de Kotlin debe usar el MISMO JDK 17 que Gradle.
# Sin esto, en Windows el daemon de Kotlin intenta arrancar con el JVM por defecto
# (JDK 24 en esta máquina) y falla con
# `java.rmi.NoSuchObjectException: no such object in table`.
kotlin.daemon.jvmargs=-Xmx2048m

# En este entorno el daemon de Kotlin es inestable; se compila en proceso.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
